[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zapzapapi"
version = "1.0.0"
description = "Official Python SDK for the ZapZap API (WhatsApp platform)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "GM Solutions Hub LTDA", email = "contato@zapzapapi.com" }]
maintainers = [{ name = "GM Solutions Hub LTDA", email = "contato@zapzapapi.com" }]
keywords = ["zapzap", "whatsapp", "api", "sdk", "messaging"]
dependencies = ["requests>=2.20"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://zapzapapi.com"
Documentation = "https://api.zapzapapi.com/llms.txt"
"Source" = "https://github.com/orodrigodamazio/zapzap-sdk-python"

[tool.setuptools]
packages = ["zapzapapi"]
